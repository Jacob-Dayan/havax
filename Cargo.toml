[package]
name = "havax"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
